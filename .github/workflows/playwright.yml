name: Playwright tests
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: '0 2 * * *' }]          # nightly full run

jobs:
  test:
    runs-on: ubuntu-latest
    container: { image: 'mcr.microsoft.com/playwright:v1.65.0-noble', options: --ipc=host }
    strategy:
      fail-fast: false
      matrix: { shardIndex: [1, 2], shardTotal: [2] }
    env:
      CI: true
      HOME: /root
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: 'blob-report-${{ matrix.shardIndex }}', path: blob-report, retention-days: 1 }

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { path: all-blob-reports, pattern: 'blob-report-*', merge-multiple: true }
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }
